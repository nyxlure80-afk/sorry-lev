<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorry Lev</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: white;
    }

    canvas {
        display: block;
    }

    #text {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(0);
        
        font-family: Georgia, serif;
        font-size: 42px;
        font-weight: bold;
        white-space: nowrap;

        color: #eeeeee;

        text-shadow:
            0 0 3px white,
            0 0 7px #ffffff,
            0 0 12px #bfc0c2,
            0 0 20px #ffffff;

        opacity: 0;
        transition: 1s ease;

        pointer-events: none;
    }

    #text.show {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="text">Sorry Lev</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const text = document.getElementById("text");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

window.addEventListener("resize", () => {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
});


/* --------------------------------
   KALP NOKTALARINI OLUŞTUR
-------------------------------- */

let heartPoints = [];

const centerX = W / 2;
const centerY = H / 2 + 10;

for (let t = 0; t <= Math.PI * 2; t += 0.025) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        -(13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t));

    heartPoints.push({
        x: centerX + x * 10,
        y: centerY + y * 10
    });
}


/* --------------------------------
   İÇİNİ DOLDURMAK İÇİN
   KALP NOKTALARINI ÇOĞALT
-------------------------------- */

let fillPoints = [];

for (let scale = 0.05; scale <= 1; scale += 0.035) {

    for (let t = 0; t <= Math.PI * 2; t += 0.08) {

        const x =
            16 * Math.pow(Math.sin(t), 3);

        const y =
            -(13 * Math.cos(t)
            - 5 * Math.cos(2*t)
            - 2 * Math.cos(3*t)
            - Math.cos(4*t));

        fillPoints.push({
            x: centerX + x * 10 * scale,
            y: centerY + y * 10 * scale
        });
    }
}


/* --------------------------------
   İKİ TOZ PEMBE KUTUCUK
-------------------------------- */

let progress1 = 0;
let progress2 = 0;

let speed = 0.012;

let box1 = {
    x: 0,
    y: 0,
    size: 18
};

let box2 = {
    x: 0,
    y: 0,
    size: 18
};


/* --------------------------------
   ÇİZİLEN KALP
-------------------------------- */

let drawnPoints = [];

let finished = false;
let startTime = null;


/* --------------------------------
   IŞILTILAR
-------------------------------- */

let sparkles = [];


/* Altın sarısı ışıltı oluştur */

function createSparkles() {

    for (let i = 0; i < 5; i++) {

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            130 + Math.random() * 100;

        sparkles.push({

            x:
                centerX +
                Math.cos(angle) * distance,

            y:
                centerY +
                Math.sin(angle) * distance,

            size:
                4 + Math.random() * 5,

            life: 1,

            speed:
                0.008 + Math.random() * 0.012
        });
    }
}


/* --------------------------------
   KUTUCUK ÇİZ
-------------------------------- */

function drawBox(box) {

    ctx.save();

    ctx.fillStyle = "#f3c6d8";

    ctx.shadowColor = "#f3c6d8";
    ctx.shadowBlur = 8;

    ctx.fillRect(
        box.x - box.size / 2,
        box.y - box.size / 2,
        box.size,
        box.size
    );

    ctx.restore();
}


/* --------------------------------
   ANA ANİMASYON
-------------------------------- */

function animate() {

    ctx.clearRect(0, 0, W, H);


    /* Kalp dolgu rengi */

    if (drawnPoints.length > 0) {

        ctx.save();

        ctx.fillStyle = "#f3c6d8";

        for (let p of drawnPoints) {

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.restore();
    }


    /* --------------------------------
       KUTUCUK 1
    -------------------------------- */

    if (!finished) {

        progress1 += speed;

        if (progress1 >= 1) {
            progress1 = 1;
        }

        const index1 =
            Math.floor(
                progress1 *
                (heartPoints.length - 1)
            );

        box1.x = heartPoints[index1].x;
        box1.y = heartPoints[index1].y;


        /* --------------------------------
           KUTUCUK 2
        -------------------------------- */

        progress2 += speed * 0.98;

        if (progress2 >= 1) {
            progress2 = 1;
        }

        const index2 =
            Math.floor(
                progress2 *
                (heartPoints.length - 1)
            );

        box2.x = heartPoints[index2].x;
        box2.y = heartPoints[index2].y;


        /* Kalp içini yavaş yavaş doldur */

        const amount =
            Math.floor(
                progress1 *
                fillPoints.length
            );

        drawnPoints =
            fillPoints.slice(0, amount);


        drawBox(box1);
        drawBox(box2);


        /* Tamamlandı */

        if (
            progress1 >= 1 &&
            progress2 >= 1
        ) {

            finished = true;

            startTime = Date.now();
        }

    } else {

        /* Son durumda kutucukları kalbin
           alt kısmında bırak */

        box1.x = centerX - 12;
        box1.y = centerY + 135;

        box2.x = centerX + 12;
        box2.y = centerY + 135;

        drawBox(box1);
        drawBox(box2);


        /* 1 saniye bekle */

        if (
            Date.now() - startTime >= 1000
        ) {

            if (
                sparkles.length < 20
            ) {
                createSparkles();
            }

            text.classList.add("show");
        }
    }


    /* --------------------------------
       ALTIN IŞILTILAR
    -------------------------------- */

    sparkles.forEach(s => {

        ctx.save();

        ctx.globalAlpha = s.life;

        ctx.fillStyle = "#FFD700";

        ctx.shadowColor = "#FFD700";
        ctx.shadowBlur = 15;


        /* Dört köşeli yıldız */

        ctx.beginPath();

        ctx.moveTo(
            s.x,
            s.y - s.size * 2
        );

        ctx.lineTo(
            s.x + s.size / 2,
            s.y - s.size / 2
        );

        ctx.lineTo(
            s.x + s.size * 2,
            s.y
        );

        ctx.lineTo(
            s.x + s.size / 2,
            s.y + s.size / 2
        );

        ctx.lineTo(
            s.x,
            s.y + s.size * 2
        );

        ctx.lineTo(
            s.x - s.size / 2,
            s.y + s.size / 2
        );

        ctx.lineTo(
            s.x - s.size * 2,
            s.y
        );

        ctx.lineTo(
            s.x - s.size / 2,
            s.y - s.size / 2
        );

        ctx.closePath();

        ctx.fill();

        ctx.restore();

        s.life -= s.speed;

    });


    sparkles =
        sparkles.filter(
            s => s.life > 0
        );


    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
